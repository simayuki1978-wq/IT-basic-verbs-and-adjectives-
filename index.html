<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IT Terminology Master</title>
    <style>
        :root {
            --bg: #f0f2f5; --card: #ffffff; --text: #1c1c1e;
            --blue: #1cb0f6; --green: #58cc02; --orange: #ff9600; --red: #ff4b4b;
            --sub: #afafaf; --border: #e5e5e5;
        }
        html[data-theme="dark"] {
            --bg: #131f24; --card: #1c2e36; --text: #f5f5f7; --border: #3c4c52; --sub: #7a9aaa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 0; min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        nav {
            padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
            background-color: var(--card); color: var(--text);
            border-bottom: 2px solid var(--border);
            position: sticky; top: 0; z-index: 100;
            transition: background-color 0.3s, color 0.3s;
        }
        .btn-home {
            padding: 8px 15px; border-radius: 12px; border: 2px solid var(--border);
            background-color: var(--card); color: var(--text);
            font-size: 12px; font-weight: 700; cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .screen {
            display: none; width: 100%; min-height: calc(100vh - 60px);
            flex-direction: column; align-items: center;
            padding: 20px; box-sizing: border-box;
            background-color: var(--bg); color: var(--text);
        }
        .screen.active { display: flex; }

        .menu-title { font-size: 1.6rem; font-weight: 900; color: var(--blue); margin: 30px 0; text-align: center; line-height: 1.2; }

        .btn-menu {
            width: 100%; max-width: 320px; padding: 25px; margin: 12px 0;
            background-color: var(--card); border: 2px solid var(--border); border-bottom: 6px solid var(--border);
            border-radius: 20px; font-size: 1.2rem; font-weight: 800; color: var(--text); cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }
        .btn-menu:active { transform: translateY(3px); border-bottom-width: 2px; }
        .btn-menu:disabled { opacity: 0.5; cursor: not-allowed; }
        .c-basic { border-color: var(--blue); color: var(--blue); }
        .c-it-v   { border-color: var(--green); color: var(--green); }
        .c-it-a   { border-color: var(--orange); color: var(--orange); }
        .c-conv   { border-color: var(--red); color: var(--red); }

        .card {
            width: 100%; max-width: 400px; background-color: var(--card); color: var(--text);
            border-radius: 28px; border: 2px solid var(--border); border-bottom: 8px solid var(--border);
            padding: 30px; box-sizing: border-box; margin-bottom: 25px; text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .card-kanji { font-size: 3.5rem; font-weight: 900; margin: 10px 0; color: var(--text); }
        .card-yomi  { font-size: 1.5rem; color: var(--sub); margin-bottom: 10px; }
        .card-eng   {
            font-size: 1.2rem; font-weight: 800; color: var(--blue);
            background: rgba(28, 176, 246, 0.1); padding: 10px; border-radius: 12px;
            display: inline-block; margin-bottom: 20px;
        }
        .example-box {
            text-align: left; background-color: var(--bg); color: var(--text);
            padding: 15px; border-radius: 15px; border-left: 5px solid var(--blue); margin-top: 10px;
            transition: background-color 0.3s, color 0.3s;
        }
        .example-label { font-size: 0.7rem; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 5px; }
        .example-text  { font-size: 1rem; line-height: 1.5; font-weight: 600; color: var(--text); }

        .controls { display: flex; gap: 20px; width: 100%; max-width: 400px; }
        .btn-ctrl {
            flex: 1; padding: 20px; border-radius: 20px; border: none;
            background: var(--blue); color: white; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; box-shadow: 0 5px 0 #1899d6;
        }
        .btn-ctrl:active { transform: translateY(3px); box-shadow: 0 2px 0 #1899d6; }
        .btn-ctrl:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }

        #counter { margin-top: 15px; font-weight: 800; color: var(--sub); }

        .error-banner {
            background: #ffebee; color: #c62828; border: 1px solid #ef9a9a;
            border-radius: 10px; padding: 10px 15px; font-size: 13px;
            margin-bottom: 15px; width: 100%; max-width: 400px; box-sizing: border-box;
            display: none; align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .btn-retry {
            padding: 5px 14px; border-radius: 8px; border: 1.5px solid #c62828;
            background: #fff; color: #c62828; font-weight: 800; font-size: 12px; cursor: pointer;
        }
        .btn-retry:active { transform: translateY(1px); }

        /* ── 会話例 (CONVERSATION) ── */
        .conv-header {
            width: 100%; max-width: 460px; text-align: center; margin-bottom: 14px;
        }
        .conv-title { font-size: 1.3rem; font-weight: 900; color: var(--red); margin-bottom: 4px; }
        .conv-subtitle { font-size: 0.8rem; color: var(--sub); font-weight: 600; }

        .stage-tabs {
            display: flex; gap: 8px; overflow-x: auto; width: 100%; max-width: 460px;
            padding-bottom: 10px; margin-bottom: 16px;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .stage-tabs::-webkit-scrollbar { display: none; }
        .stage-tab {
            flex-shrink: 0; padding: 10px 16px; border-radius: 14px;
            border: 2px solid var(--border); background: var(--card); color: var(--sub);
            font-size: 0.8rem; font-weight: 800; cursor: pointer; white-space: nowrap;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .stage-tab.active { border-color: var(--red); color: var(--red); background: rgba(255,75,75,0.08); }
        .stage-num {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--sub); color: #fff; font-size: 0.65rem; margin-right: 5px;
        }
        .stage-tab.active .stage-num { background: var(--red); }

        .conv-card {
            width: 100%; max-width: 460px; background-color: var(--card);
            border-radius: 24px; border: 2px solid var(--border); border-bottom: 8px solid var(--border);
            padding: 22px 20px; box-sizing: border-box; margin-bottom: 16px;
            transition: background-color 0.3s, color 0.3s;
        }
        .conv-scenario {
            font-size: 0.78rem; color: var(--sub); font-weight: 600;
            padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1.5px dashed var(--border);
        }
        .conv-line { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
        .conv-line:last-child { margin-bottom: 0; }
        .conv-avatar {
            flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 900; color: #fff;
        }
        .conv-avatar.role-a { background: var(--blue); }
        .conv-avatar.role-b { background: var(--red); }
        .conv-bubble { flex: 1; min-width: 0; }
        .conv-speaker { font-size: 0.72rem; font-weight: 800; color: var(--sub); margin-bottom: 3px; }
        .conv-text {
            font-size: 1rem; line-height: 1.65; font-weight: 600; color: var(--text);
            background: var(--bg); border-radius: 12px; padding: 10px 14px;
        }
        .conv-text-en {
            font-size: 0.82rem; line-height: 1.5; color: var(--sub); font-weight: 500;
            margin-top: 5px; padding: 0 14px; display: none;
        }
        .conv-text-en.visible { display: block; }

        .conv-toolbar {
            display: flex; gap: 10px; width: 100%; max-width: 460px; margin-bottom: 14px;
        }
        .btn-toggle-en {
            flex: 1; padding: 12px; border-radius: 14px; border: 2px solid var(--border);
            background: var(--card); color: var(--text); font-weight: 800; font-size: 0.9rem;
            cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s;
        }
        .btn-toggle-en.on { border-color: var(--blue); color: var(--blue); background: rgba(28,176,246,0.08); }
    </style>
</head>
<body>

<nav>
    <button class="btn-home" onclick="goHome()">← HOME</button>
    <div id="status" style="font-size: 10px; font-weight: 900; color: var(--text);">LOADING...</div>
    <button class="btn-home" onclick="toggleDark()">🌙 DARK</button>
</nav>

<!-- トップ画面 -->
<div id="scr-top" class="screen active">
    <h1 class="menu-title">IT JAPANESE<br>LEARNING</h1>
    <div id="error-banner" class="error-banner">
        <span>⚠️ <span id="error-banner-text">データの読み込みに失敗しました。</span></span>
        <button class="btn-retry" onclick="retryLoad()">🔄 再試行</button>
    </div>
    <button class="btn-menu c-basic" id="btn-basic" onclick="startMode('basic')" disabled>基本動詞100 (読込中...)</button>
    <button class="btn-menu c-it-v"  id="btn-itv"   onclick="startMode('itv')"   disabled>IT動詞100 (読込中...)</button>
    <button class="btn-menu c-it-a"  id="btn-ita"   onclick="startMode('ita')"   disabled>IT形容詞 (読込中...)</button>
    <button class="btn-menu c-conv"  id="btn-conv"  onclick="startConv()">💬 会話例（オフショア開発）</button>
</div>

<!-- カード画面 -->
<div id="scr-card" class="screen">
    <div class="card">
        <div onclick="speak()" style="cursor:pointer; font-size: 2.5rem; margin-bottom: 15px;" title="発音を聞く">🔊</div>
        <div class="card-yomi"  id="c-yomi">--</div>
        <h2 class="card-kanji" id="c-kanji">--</h2>
        <div class="card-eng"   id="c-eng">--</div>
        <div class="example-box">
            <div class="example-label">Example Sentence</div>
            <div class="example-text" id="c-ex">--</div>
        </div>
    </div>
    <div class="controls">
        <button class="btn-ctrl" onclick="prev()" id="btn-prev">← PREV</button>
        <button class="btn-ctrl" onclick="next()" id="btn-next">NEXT →</button>
    </div>
    <div id="counter">0 / 0</div>
</div>

<!-- 会話例画面 -->
<div id="scr-conv" class="screen">
    <div class="conv-header">
        <div class="conv-title">💬 会話例</div>
        <div class="conv-subtitle">オフショア開発の会議・打ち合わせ想定 / Offshore development meeting scenarios</div>
    </div>

    <div class="stage-tabs" id="stage-tabs"></div>

    <div class="conv-toolbar">
        <button class="btn-toggle-en" id="btn-toggle-en" onclick="toggleConvEn()">🇬🇧 English</button>
    </div>

    <div class="conv-card" id="conv-card">
        <div class="conv-scenario" id="conv-scenario"></div>
        <div id="conv-lines"></div>
    </div>

    <div class="controls">
        <button class="btn-ctrl" onclick="prevStage()" id="btn-conv-prev">← PREV</button>
        <button class="btn-ctrl" onclick="nextStage()" id="btn-conv-next">NEXT →</button>
    </div>
    <div id="conv-counter" style="margin-top: 15px; font-weight: 800; color: var(--sub);">1 / 6</div>
</div>

<script>
    const URLS = {
        basic: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=979504695&single=true&output=csv',
        itv:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=1703691449&single=true&output=csv',
        ita:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=2089928581&single=true&output=csv'
    };
    const LABELS = { basic: '基本動詞100', itv: 'IT動詞100', ita: 'IT形容詞' };
    const BTN_IDS = { basic: 'btn-basic', itv: 'btn-itv', ita: 'btn-ita' };

    const dataStore = { basic: [], itv: [], ita: [] };
    let currentMode  = '';
    let currentList  = [];
    let currentIndex = 0;
    let currentVoice = '';
    let failedKeys   = [];

    // ── 音声読み上げ設定 ──────────────────────────────────────────────
    // 1) まず VOICEVOX（正確な日本語アクセント辞書を持つ無料の音声合成エンジン）を
    //    api.tts.quest の無料公開プロキシ経由で試す（自前サーバー・APIキーとも不要）。
    // 2) 失敗・タイムアウト・オフライン等の場合は、端末組み込みの音声合成に自動的に
    //    切り替える（フォールバック）ので、常に読み上げ自体は機能する。
    //
    // 話者ID（0始まり）。3=ずんだもん(ノーマル) は無料枠での動作を確認済み。
    // 落ち着いた声色を試したい場合は 2=四国めたん(ノーマル) / 9=波音リツ(ノーマル) /
    // 13=青山龍星(ノーマル) 等に変更可能（発音・アクセントの正確さは声色に関わらず同じ）。
    // 話者一覧: https://static.tts.quest/voicevox_speakers_utf8.json
    // より高速・安定させたい場合は https://su-shiki.com/api/ で無料APIキーを取得し
    // VOICEVOX_API_KEY に設定してください（未設定でも動作します）。
    const USE_VOICEVOX        = true;
    const VOICEVOX_SPEAKER_ID = 3;
    const VOICEVOX_API_KEY    = '';
    const VOICEVOX_TIMEOUT_MS = 7000;

    const voicevoxUrlCache = new Map(); // text -> mp3StreamingUrl（同じ単語の再取得を防ぐ）
    let activeAudio = null;             // 再生中のVOICEVOX音声（連打・画面遷移時に停止するため）
    let jaVoices = [];                  // 端末の日本語音声一覧（フォールバック用）

    function loadJaVoices() {
        jaVoices = window.speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    }
    if ('speechSynthesis' in window) {
        loadJaVoices();
        window.speechSynthesis.onvoiceschanged = loadJaVoices;
    }

    // 修正点: 従来は u.lang='ja-JP' を指定するのみでブラウザ任せの音声が使われており、
    // 環境によっては低品質・アクセント不自然な音声が選ばれていた。
    // 既知の高品質な音声を優先的に選び、なければネットワーク音声（クラウド品質の
    // ことが多い）、それも無ければ利用可能な日本語音声を使うようにする。
    function pickBestJapaneseVoice() {
        if (jaVoices.length === 0) return null;
        const preferredNames = [
            'Google 日本語',
            'Microsoft Nanami Online (Natural) - Japanese (Japan)',
            'Microsoft Keita Online (Natural) - Japanese (Japan)',
            'Microsoft Ayumi Online (Natural) - Japanese (Japan)',
            'O-Ren', 'Kyoko', 'Otoya'
        ];
        for (const name of preferredNames) {
            const v = jaVoices.find(v => v.name.includes(name));
            if (v) return v;
        }
        const remote = jaVoices.find(v => v.localService === false);
        if (remote) return remote;
        return jaVoices[0];
    }

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const ch   = text[i];
            const next = text[i + 1];

            if (inQuotes) {
                if (ch === '"' && next === '"') { cell += '"'; i++; }
                else if (ch === '"')             { inQuotes = false; }
                else                             { cell += ch; }
            } else {
                if      (ch === '"')  { inQuotes = true; }
                else if (ch === ',')  { row.push(cell.trim()); cell = ''; }
                else if (ch === '\n' || (ch === '\r' && next === '\n')) {
                    if (ch === '\r') i++;
                    row.push(cell.trim()); cell = '';
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                } else if (ch === '\r') {
                    row.push(cell.trim()); cell = '';
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                } else { cell += ch; }
            }
        }
        if (cell !== '' || row.length > 0) {
            row.push(cell.trim());
            if (row.some(c => c !== '')) rows.push(row);
        }
        return rows;
    }

    // 修正点: タイムアウト処理を追加（通信が固まって "LOADING..." のまま止まるのを防止）
    // 修正点: Content-Type を確認し、CSVの代わりにHTML（権限エラーページ等）が
    //         返ってきた場合に「成功扱いで文字化けデータを表示する」バグを防止
    async function loadCSV(url, timeoutMs = 15000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        let res;
        try {
            res = await fetch(url + '&v=' + Date.now(), { signal: controller.signal, cache: 'no-store' });
        } catch (e) {
            if (e.name === 'AbortError') throw new Error('通信がタイムアウトしました');
            throw e;
        } finally {
            clearTimeout(timer);
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const contentType = res.headers.get('content-type') || '';
        const text = await res.text();
        if (contentType.includes('text/html')) {
            throw new Error('CSVではなくHTMLが返されました（シートの公開設定をご確認ください）');
        }

        const rows = parseCSV(text);
        return rows.slice(1).filter(r => r[0]);
    }

    // 修正点: Promise.all → Promise.allSettled
    // 旧コードは3つのシートのうち1つでも読み込みに失敗すると、
    // 残り2つが正常でも全ボタンが disabled のままになっていた。
    // シート単位で成功/失敗を判定し、成功した分だけでも使えるようにする。
    async function init(keysToLoad = ['basic', 'itv', 'ita']) {
        const results = await Promise.allSettled(keysToLoad.map(k => loadCSV(URLS[k])));

        failedKeys = failedKeys.filter(k => !keysToLoad.includes(k));

        results.forEach((result, i) => {
            const key = keysToLoad[i];
            if (result.status === 'fulfilled') {
                dataStore[key] = result.value;
                updateBtn(BTN_IDS[key], `${LABELS[key]} (${result.value.length}件)`);
            } else {
                console.error(`[${key}] 読み込み失敗:`, result.reason);
                failedKeys.push(key);
                const b = document.getElementById(BTN_IDS[key]);
                b.innerText = `${LABELS[key]} (読込失敗 ⚠️)`;
                b.disabled = true;
            }
        });

        const banner = document.getElementById('error-banner');
        if (failedKeys.length > 0) {
            document.getElementById('status').innerText = '⚠️ ERROR';
            document.getElementById('error-banner-text').innerText =
                `一部データの読み込みに失敗しました（${failedKeys.length}件）。ネットワークまたはシートの公開設定をご確認ください。`;
            banner.style.display = 'flex';
        } else {
            document.getElementById('status').innerText = '✅ SYNCED';
            banner.style.display = 'none';
        }
    }

    // 修正点: 失敗したシートだけを再取得するリトライ機能を追加
    // （旧コードにはエラー時の回復手段がなく、ページの手動リロードしかなかった）
    function retryLoad() {
        if (failedKeys.length === 0) return;
        document.getElementById('status').innerText = '🔄 RETRYING...';
        const retrying = [...failedKeys];
        retrying.forEach(key => {
            const b = document.getElementById(BTN_IDS[key]);
            b.innerText = `${LABELS[key]} (読込中...)`;
        });
        init(retrying);
    }

    function updateBtn(id, text) {
        const b = document.getElementById(id);
        b.disabled  = false;
        b.innerText = text;
    }

    function goHome() {
        stopAllAudio();
        document.getElementById('scr-card').classList.remove('active');
        document.getElementById('scr-conv').classList.remove('active');
        document.getElementById('scr-top').classList.add('active');
    }

    function toggleDark() {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    }

    function startMode(mode) {
        currentMode  = mode;
        currentList  = dataStore[mode];
        currentIndex = 0;

        // 修正点: 該当データが0件のままボタンだけ有効になっているケース（空シート等）で
        // 何も起きずに無反応になる（ユーザーがバグと誤解する）のを防ぎ、明示的に知らせる
        if (!currentList || currentList.length === 0) {
            alert('このカテゴリのデータが読み込まれていません。「再試行」をお試しいただくか、シートの内容をご確認ください。');
            return;
        }

        updateCard();
        document.getElementById('scr-top').classList.remove('active');
        document.getElementById('scr-card').classList.add('active');
    }

    function updateCard() {
        const d = currentList[currentIndex];
        if (!d) return;

        document.getElementById('c-kanji').innerText = d[0] || '--';
        document.getElementById('c-yomi').innerText  = d[1] || '--';
        document.getElementById('c-eng').innerText   = d[2] || '--';
        document.getElementById('c-ex').innerText    = d[3] || '例文はありません。';
        document.getElementById('counter').innerText = `${currentIndex + 1} / ${currentList.length}`;

        currentVoice = d[1] || '';

        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === currentList.length - 1;
    }

    function next() {
        if (currentIndex < currentList.length - 1) { stopAllAudio(); currentIndex++; updateCard(); }
    }
    function prev() {
        if (currentIndex > 0) { stopAllAudio(); currentIndex--; updateCard(); }
    }

    document.addEventListener('keydown', (e) => {
        if (document.getElementById('scr-card').classList.contains('active')) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
            if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
            if (e.key === ' ') { e.preventDefault(); speak(); }
        }
        if (document.getElementById('scr-conv').classList.contains('active')) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextStage();
            if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevStage();
        }
    });

    function stopAllAudio() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        if (activeAudio) { activeAudio.pause(); activeAudio = null; }
    }

    async function speak() {
        if (!currentVoice) return;
        stopAllAudio();

        if (USE_VOICEVOX) {
            const ok = await speakWithVoicevox(currentVoice);
            if (ok) return;
            console.warn('VOICEVOXでの再生に失敗したため、端末音声にフォールバックします');
        }
        speakWithBrowser(currentVoice);
    }

    // VOICEVOX（api.tts.quest 経由）で読み上げる。成功したら true、
    // 失敗・タイムアウトの場合は false を返す（呼び出し側でフォールバック判定に使う）。
    async function speakWithVoicevox(text) {
        try {
            let url = voicevoxUrlCache.get(text);
            if (!url) {
                const params = new URLSearchParams({ speaker: VOICEVOX_SPEAKER_ID, text });
                if (VOICEVOX_API_KEY) params.set('key', VOICEVOX_API_KEY);

                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), VOICEVOX_TIMEOUT_MS);
                let res;
                try {
                    res = await fetch(`https://api.tts.quest/v3/voicevox/synthesis?${params.toString()}`, { signal: controller.signal });
                } finally {
                    clearTimeout(timer);
                }
                if (!res.ok) return false;

                const data = await res.json();
                if (!data.success || !data.mp3StreamingUrl) return false;

                url = data.mp3StreamingUrl;
                voicevoxUrlCache.set(text, url);
            }

            await new Promise((resolve, reject) => {
                const audio = new Audio(url);
                activeAudio = audio;
                audio.addEventListener('canplay', resolve, { once: true });
                audio.addEventListener('error', () => reject(new Error('VOICEVOX audio load error')), { once: true });
                audio.play().catch(reject);
            });
            return true;

        } catch (e) {
            console.warn('VOICEVOX読み上げエラー:', e);
            return false;
        }
    }

    // 端末組み込みの音声合成（Web Speech API）で読み上げる。VOICEVOXが使えない
    // 環境や、応答がない場合のフォールバックとして使用する。
    function speakWithBrowser(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.rate = 0.9;
        const voice = pickBestJapaneseVoice();
        if (voice) u.voice = voice;
        window.speechSynthesis.speak(u);
    }

    ];

    let convIndex = 0;
    let convShowEn = false;
    let stageTabsBuilt = false; // 修正点: タブDOMを毎回作り直さないためのフラグ

    // 修正点: 従来は画面切替のたびに全タブ(6個のボタン)をinnerHTMLで作り直していた。
    // 初回だけ生成し、以降は active クラスの付け替えのみ行うよう分離（軽量化）。
    function renderStageTabs() {
        const wrap = document.getElementById('stage-tabs');
        wrap.innerHTML = '';
        conversations.forEach((c, i) => {
            const btn = document.createElement('button');
            btn.className = 'stage-tab';
            btn.innerHTML = `<span class="stage-num">${i + 1}</span>${c.stage.replace(/^[①-⑥]\s*/, '')}`;
            btn.onclick = () => { convIndex = i; renderConv(); };
            wrap.appendChild(btn);
        });
        stageTabsBuilt = true;
        updateStageTabsActive();
    }

    function updateStageTabsActive() {
        document.querySelectorAll('#stage-tabs .stage-tab').forEach((btn, i) => {
            btn.classList.toggle('active', i === convIndex);
        });
    }

    function renderConv() {
        const c = conversations[convIndex];

        document.getElementById('conv-scenario').innerText = `${c.stage}（${c.stageEn}） — ${c.scenario}`;

        const linesEl = document.getElementById('conv-lines');
        linesEl.innerHTML = '';
        c.lines.forEach(line => {
            const isA = line.role === 'a';
            const wrap = document.createElement('div');
            wrap.className = 'conv-line';
            wrap.innerHTML = `
                <div class="conv-avatar ${isA ? 'role-a' : 'role-b'}">${isA ? c.roleA[0] : c.roleB[0]}</div>
                <div class="conv-bubble">
                    <div class="conv-speaker">${isA ? c.roleA : c.roleB}</div>
                    <div class="conv-text">${line.ja}</div>
                    <div class="conv-text-en ${convShowEn ? 'visible' : ''}">${line.en}</div>
                </div>
            `;
            linesEl.appendChild(wrap);
        });

        document.getElementById('conv-counter').innerText = `${convIndex + 1} / ${conversations.length}`;
        document.getElementById('btn-conv-prev').disabled = convIndex === 0;
        document.getElementById('btn-conv-next').disabled = convIndex === conversations.length - 1;

        if (!stageTabsBuilt) renderStageTabs(); else updateStageTabsActive();
    }

    function toggleConvEn() {
        convShowEn = !convShowEn;
        document.getElementById('btn-toggle-en').classList.toggle('on', convShowEn);
        document.getElementById('btn-toggle-en').innerText = convShowEn ? '🇬🇧 English ✓' : '🇬🇧 English';
        document.querySelectorAll('.conv-text-en').forEach(el => el.classList.toggle('visible', convShowEn));
    }

    function nextStage() {
        if (convIndex < conversations.length - 1) { convIndex++; renderConv(); }
    }
    function prevStage() {
        if (convIndex > 0) { convIndex--; renderConv(); }
    }

    function startConv() {
        convIndex = 0;
        renderConv();
        document.getElementById('scr-top').classList.remove('active');
        document.getElementById('scr-conv').classList.add('active');
    }

    init();
</script>
